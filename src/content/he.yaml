  paragraphs:
    - מטפלת רגשית־מינית הוליסטית ומנחת סדנאות לזוגות ולנשים.
    - בעלת תואר ראשון בפסיכולוגיה וסוציולוגיה, מורה מוסמכת ליוגה והדרכת כושר ובוגרת ההכשרה להנחיית טנטרה מטעם בי"ס מאר"ג.
    - מלווה נשים וזוגות בתהליכים של חיבור לגוף, לרגש ולמיניות, ועוסקת בחיבור שבין אהבה, יחסים, תנועה, נוכחות ומגע קשוב.
    - משלבת כלים מעולמות הטנטרה, המיינדפולנס, הנשימה, התנועה ועוד.
