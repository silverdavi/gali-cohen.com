accessibility:
  title: הצהרת נגישות
  updated: 7 בספטמבר 2026
  body: |-
    אתר זה נבנה מתוך כוונה שיהיה נגיש וידידותי לכל המשתמשות והמשתמשים, כולל אנשים עם מוגבלויות, ואנו פועלים להנגיש אותו בהתאם לתקן הישראלי (ת"י 5568) ולהנחיות WCAG 2.1 ברמה AA, ככל שהדבר רלוונטי לאתר תדמית של עסק קטן מסוג זה.

    בין הפעולות שננקטו: מבנה סמנטי וברור של העמודים, טקסט חלופי לתמונות, ניגודיות צבעים נבדקת, תמיכה מלאה בניווט מקלדת, קישור "דלגו לתוכן" בראש העמוד, וכיבוד הגדרת "הפחתת תנועה" של מערכת ההפעלה עבור אנימציות.

    בנוסף, בפינת המסך נמצא רכיב נגישות ובו אפשר להתאים את גודל הגופן, להפעיל ניגודיות גבוהה או תצוגה בגווני אפור, להוסיף קו תחתון לקישורים, ולעצור אנימציות באתר. ההתאמות נשמרות בדפדפן שלכם גם לביקורים הבאים.

    אנו ממשיכים לבדוק ולשפר את נגישות האתר. אם נתקלתם בקושי או בתקלה בנושא נגישות, נשמח שתעדכנו אותנו כדי שנוכל לתקן בהקדם.

    לפניות בנושא נגישות אפשר לפנות במייל: GaliCo.10@gmail.com — נשתדל להשיב תוך זמן סביר.
privacy:
  title: מדיניות פרטיות
  updated: 7 בספטמבר 2026
  body: |-
    האתר galigeula.com הוא אתר תדמית של גלי גאולה כהן, ומכבד את פרטיותכם. מסמך זה מסביר אילו מידע נאסף בעת השימוש באתר וכיצד הוא נשמר.

    האתר הוא אתר סטטי, ואין לו מסד נתונים או שרת שאוספים ושומרים מידע על המבקרים בו. טופס יצירת הקשר באתר אינו שולח מידע לשום שרת - הוא פותח עבורכם הודעת וואטסאפ מוכנה מראש עם הפרטים שהזנתם, ואתם אלו שמחליטים אם לשלוח אותה.

    האתר אינו משתמש בכלי מעקב או פרסום כגון Google Analytics או Facebook Pixel, ואינו שותל עוגיות מעקב. סרטוני הפודקאסט מוטמעים מיוטיוב בגרסה השומרת על פרטיות (youtube-nocookie.com) - עוגייה מטעם יוטיוב נטענת רק אם בוחרים בפועל ללחוץ על נגן ולצפות בסרטון, לא לפני כן.

    העדפות שאתם בוחרים ברכיב הנגישות (כגון גודל גופן או ניגודיות) נשמרות רק בדפדפן שלכם, ואינן מועברות אלינו או לכל גורם אחר.

    האתר מתארח על שירותי אחסון חיצוניים (GitHub Pages), שכמקובל בכל שירות אחסון אינטרנטי עשויים לשמור יומני גישה טכניים בסיסיים (כגון כתובת IP) לצורך תפעול ואבטחת השירות, בהתאם למדיניות הפרטיות של אותו ספק.

    פניות שנשלחות דרך וואטסאפ, אינסטגרם או מייל מתנהלות בפלטפורמות של צד שלישי (Meta, Google וכדומה), ומידע זה כפוף למדיניות הפרטיות של אותן פלטפורמות.

    מדיניות זו עשויה להתעדכן מעת לעת. לשאלות בנושא פרטיות אפשר לפנות במייל: GaliCo.10@gmail.com.
terms:
  title: תנאי שימוש
  updated: 7 בספטמבר 2026
  body: |-
    השימוש באתר galigeula.com כפוף לתנאים המפורטים להלן. גלישה באתר מהווה הסכמה לתנאים אלו.

    התכנים והשירותים המוצגים באתר (סדנאות, מפגשי נשימה ותנועה, ליווי גוף-נפש ותכנים נלווים) הם למטרות רווחה אישית והעשרה, ואינם מהווים תחליף לייעוץ, אבחון או טיפול רפואי או נפשי מקצועי. בכל שאלה בריאותית יש להיוועץ בגורם מוסמך.

    פרטי מפגשים, סדנאות ומוצרים (לרבות מחירים) המוצגים באתר הם למטרות מידע כלליות ועשויים להשתנות. הזמנה, תיאום מועדים, תשלום, ביטולים ושינויים מתבצעים בתיאום ישיר מול גלי גאולה כהן (בוואטסאפ, במייל או בקישורי ההרשמה/הרכישה המופיעים באתר), ואינם מנוהלים דרך האתר עצמו.

    כל הטקסטים, התמונות והתכנים באתר, אלא אם צוין אחרת, הם רכושה של גלי גאולה כהן, ואין להעתיקם, להפיצם או לעשות בהם שימוש מסחרי ללא אישור מראש ובכתב.

    האתר מכיל קישורים לאתרים ולפלטפורמות חיצוניים (כגון וואטסאפ, אינסטגרם, פייסבוק ויוטיוב). אין לנו שליטה על תוכן אותם אתרים ואיננו אחראים להם.

    השימוש באתר הוא באחריות המשתמש/ת בלבד. אנו עושים מאמץ סביר לשמור על דיוק ועדכניות המידע באתר, אך איננו מתחייבים שהאתר יהיה נקי משגיאות או זמין ללא הפרעה. על תנאים אלה יחולו דיני מדינת ישראל, וסמכות השיפוט הבלעדית נתונה לבתי המשפט המוסמכים בישראל.

    אנו רשאים לעדכן תנאים אלה מעת לעת. לשאלות ניתן לפנות במייל: GaliCo.10@gmail.com.
