  - slug: private-tantra-couples
    titleHe: סדנת טנטרה פרטית חוויתית לזוגות
    ongoing: true
    scheduleHe: בתיאום אישי
    date: ''
    time: ''
    endTime: ''
    locationHe: תל אביב
    locationUrl: ''
    introHe: סדנה חוויתית פרטית אינטימית לזוגות שרוצים להעמיק את החיבור, האהבה והעונג.
    descHe: |-
      על הסדנה — מסע של אהבה, ריפוי ותשוקה

      אם אתם מרגישים שהקשר שלכם מבקש עוד חום, עומק, חיבור או התחדשות — זו הזמנה לדייט זוגי אינטימי מסוג אחר.

      הסדנה היא מסע של כ־3 שעות, שנבנה בהדרגה — מיצירת אמון ובטחון, העמקת התקשורת וההקשבה לחקירה וגילוי דרך מגע.

      במהלך הסדנה נעבור תהליך הדרגתי:
      • חלק ראשון – חיבור ללב: תרגולים עדינים של נשימה, נוכחות, מבט ותקשורת שפותחים את הלב ומעמיקים את ההקשבה לעצמכם ולפרטנר.
      • חלק שני – מגע ומפגש מחודש: לימוד שפה חדשה של מגע – מגע קשוב, נוכח, לא מטרתי אלא חוקר ומגלה.

      נלמד להאט, להקשיב לחכמה האדירה שבגופנו, ולתת לאנרגיה לזרום באופן טבעי, ללא מאמץ.

      הסדנה משלבת כלים מעולמות הטנטרה, המודעות, הנשימה והתנועה – ומאפשרת חוויה שהיא גם מענגת וגם מלמדת.

      הסדנה היא טעימה מעולם הטנטרה – כשהמהות היא לצייד אתכם עם כלים להעמקה וחקירה שילוו גם לאחר הסדנה.

      חשוב לדעת:
      • לפני הסדנה כל אחד מבני הזוג מקבל שאלון אישי קצר – שמטרתו לעזור לכם ולי להתכוונן יותר לקראת הסדנה ולהבין טוב יותר את הצרכים, הרצונות והגבולות שלכם.
      • אין עירום או מגע באברי המין במהלך הסדנה (אפשר להישאר בהלבשה תחתונה).
      • כל התרגולים מתבצעים רק בין בני הזוג, ללא כל מגע עם המנחה.
      • הסדנה מתאימה גם לזוגות להטבי"ם, דתיים וחרדים.
      • הסדנה מתקיימת בתל אביב.
      • מחיר: 700 ש"ח לאדם (1400 לזוג).
