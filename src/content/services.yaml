          ליווי זוגי תהליכי המאפשר להעמיק את התקשורת, האינטימיות והחיבור, תוך יצירת מרחב בטוח לצמיחה משותפת.

          דרך תרגילי נשימה, מגע ותנועה משותפים, אנחנו יוצרים מרחב שבו אפשר לשוב ולראות אחד את השנייה, לפרק דפוסים ישנים וליצור שפה חדשה יותר של קרבה.

          כל מפגש מותאם למה שהזוג מביא איתו באותו הזמן - אין ציפייה ל"תיקון" מהיר, יש הקשבה משותפת.
