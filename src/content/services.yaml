# שירותים — שתי קטגוריות (individual-guidance-women / couples-guidance),
# כל אחת עם רשימת "מסלולים" (tracks) משלה. סדנאות אינן תהליך אישי;
# הן חיות ב-/workshops.
heading:
  labelHe: תהליכים אישיים
  titleHe: תהליכים אישיים
  subHe: ''
introHe:
  - היי, אני גלי גאולה, מטפלת ומלווה נשים וזוגות בתהליכים רגשיים, גופניים, אינטימיים ומיניים, בגישה הוליסטית וקשובה. הקליניקה שלי נמצאת בדרום תל אביב.
  - "בתהליך אנחנו פוגשות בעדינות, צעד אחר צעד, את מה שמבקש להיראות ולהירפא: דפוסים שכבר לא משרתים, אמונות מגבילות וחסמים."
  - אני עובדת עם שיח קשוב, עבודה סומטית, כלים מעולמות הטנטרה והמדיטציה, תנועה, קול ומגע. ולפני הכול, אני מקשיבה למה שעולה ברגע.
  - אני מאמינה שבכל אחת ואחד יש הדרכה פנימית. לכן אני לא באה עם תשובות מוכנות. אני מחזיקה את היד, נותנת מקום, מציעה כלים ועוזרת להתחבר לחוכמה ולאינטואיציה שבפנים.
  - בעלת תואר ראשון בפסיכולוגיה וסוציולוגיה מהאוניברסיטה העברית, מורה מוסמכת ליוגה ומדריכת כושר, ובוגרת ההכשרה להנחיית טנטרה מטעם בי"ס מאר"ג. אינני פסיכולוגית.
  - באהבה, גלי גאולה
