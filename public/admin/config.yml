# Sveltia CMS configuration for galigeula.com (admin at /admin)
# -----------------------------------------------------------------------------
# LIVE LOGIN (no server, no OAuth app):
#   Open https://galigeula.com/admin, click "Sign In with Token", follow the
#   link to GitHub (scopes are pre-selected), generate a token, paste it back.
#   The browser remembers it — that token is effectively the password.
#   The GitHub account must have write access to the repo. See CMS-SETUP.md.
#
# LOCAL EDITING (no login, no proxy — Chromium browser):
#   npm run dev, open http://localhost:5173/admin/, click "Work with Local
#   Repository" and pick the repo folder.
#
# Publishing here commits straight to `main` (see backend.branch below), which
# automatically triggers the GitHub Actions workflow that builds and deploys
# the site — publish and the live site updates on its own, nothing else to do.
#
# The whole site is Hebrew, so every field below is Hebrew only — no English.

backend:
  name: github
  repo: silverdavi/gali-cohen.com
  branch: main
  auth_methods: [token]

media_folder: "public/photos"
public_folder: "/photos"

singletons:
  - name: services
    label: "שירותים"
    file: "src/content/services.yaml"
    icon: self_improvement
    fields:
      - label: "כותרת הקטע"
        name: heading
        widget: object
        collapsed: true
        fields:
          - { label: "תווית קטנה", name: labelHe, widget: string }
          - { label: "כותרת", name: titleHe, widget: string }
          - { label: "כותרת משנה", name: subHe, widget: string, required: false }
      - label: "קטגוריות"
        name: categories
        widget: list
        summary: "{{fields.titleHe}}"
        hint: "שלוש קטגוריות קבועות (ליווי אישי לנשים / ליווי זוגי / סדנאות) — אין להוסיף או להסיר קטגוריה, רק לערוך את התוכן והמסלולים בתוכה."
        fields:
          - { label: "מזהה (slug) — לא לשנות, קובע את כתובת הדף", name: slug, widget: string }
          - { label: "שם הקטגוריה", name: titleHe, widget: string }
          - { label: "תיאור קצר (מוצג בכרטיס ובראש הדף)", name: shortDescHe, widget: text }
          - { label: "תמונה", name: photo, widget: image }
          - { label: "תיאור התמונה (לנגישות)", name: photoAltHe, widget: string }
          - { label: "תיאור לגוגל (SEO, עד 160 תווים)", name: metaDescriptionHe, widget: string }
          - label: "מסלולים בקטגוריה"
            name: tracks
            widget: list
            summary: "{{fields.titleHe}}"
            hint: "אפשר להוסיף/להסיר מסלולים חופשית."
            fields:
              - { label: "שם המסלול", name: titleHe, widget: string }
              - { label: "שורת פרטים (למשל: אחת על אחת · 60 דקות)", name: noteHe, widget: string, required: false }
              - { label: "תיאור מלא", name: bodyHe, widget: text }
              - label: "סוג מחיר"
                name: priceType
                widget: select
                default: fixed
                options:
                  - { label: "מחיר קבוע", value: fixed }
                  - { label: "לפי פנייה (ללא מחיר מוצג)", value: contact }
              - { label: "מחיר (₪, מספר בלבד — רק אם 'סוג מחיר' הוא מחיר קבוע)", name: price, widget: number, required: false, value_type: int }
              - label: "יחידת המחיר"
                name: priceUnit
                widget: select
                required: false
                options:
                  - { label: "למפגש", value: session }
                  - { label: "לאדם", value: person }
                  - { label: "לחבילה", value: package }
              - { label: "תמונה (אופציונלי — ריק = תמונת הקטגוריה)", name: photo, widget: image, required: false }
              - { label: "תיאור התמונה (לנגישות)", name: photoAltHe, widget: string, required: false }
          - label: "התהליך — שלבים (אופציונלי)"
            name: processSteps
            widget: list
            required: false
            summary: "{{fields.titleHe}}"
            hint: "מוצג כרשימה ממוספרת בראש דף הקטגוריה. השאירו ריק כדי לא להציג שלבים בכלל."
            fields:
              - { label: "כותרת השלב", name: titleHe, widget: string }
              - { label: "תיאור השלב", name: bodyHe, widget: text }

  - name: workshops
    label: "סדנאות (יומן)"
    file: "src/content/workshops.yaml"
    icon: event
    fields:
      - label: "כותרת הקטע"
        name: heading
        widget: object
        collapsed: true
        fields:
          - { label: "תווית קטנה", name: labelHe, widget: string }
          - { label: "כותרת", name: titleHe, widget: string }
          - { label: "כותרת משנה", name: subHe, widget: string, required: false }
          - { label: "תווית כפתור", name: ctaHe, widget: string }
      - { label: "קישור לקבוצת ווטסאפ לעדכונים", name: groupUrl, widget: string, required: false, hint: "אם ריק — הכפתור לא יוצג." }
      - { label: "טקסט כפתור קבוצת הווטסאפ", name: groupLabelHe, widget: string, required: false }
      - label: "סדנאות"
        name: items
        widget: list
        summary: "{{fields.date}} — {{fields.titleHe}}"
        fields:
          - { label: "מזהה (slug)", name: slug, widget: string, hint: "אותיות אנגלית/מספרים/מקפים בלבד — קובע את כתובת ה-URL של הסדנה, למשל mindful-dance-2026-10-08." }
          - { label: "שם הסדנה", name: titleHe, widget: string }
          - { label: "תאריך", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
          - { label: "שעה (למשל 20:00)", name: time, widget: string, required: false }
          - { label: "שעת סיום (אופציונלי)", name: endTime, widget: string, required: false }
          - { label: "מיקום", name: locationHe, widget: string }
          - { label: "קישור למפה (אופציונלי)", name: locationUrl, widget: string, required: false }
          - { label: "פתיח רגשי (אופציונלי, שורה-שתיים בראש הדף)", name: introHe, widget: text, required: false }
          - { label: "תיאור מלא", name: descHe, widget: text }
          - { label: "מה קורה בסדנה (אופציונלי)", name: whatHappensHe, widget: text, required: false }
          - { label: "למי זה מתאים (אופציונלי)", name: whoForHe, widget: text, required: false }
          - { label: "תיאור לגוגל (SEO, עד 160 תווים)", name: metaDescriptionHe, widget: string, required: false }
          - { label: "תמונה", name: image, widget: image, required: false }
          - label: "גלריה (אופציונלי)"
            name: gallery
            widget: list
            required: false
            field: { label: "תמונה", name: src, widget: image }
          - label: "קטגוריית שירות קשורה (אופציונלי)"
            name: categorySlug
            widget: select
            required: false
            options:
              - { label: "ליווי אישי לנשים", value: individual-guidance-women }
              - { label: "ליווי זוגי", value: couples-guidance }
              - { label: "סדנאות", value: workshops-format }
          - { label: "קישור להרשמה", name: signupUrl, widget: string, required: false, hint: "אם ריק — מפנה לוואטסאפ." }
          - label: "סוג מחיר"
            name: priceType
            widget: select
            default: fixed
            options:
              - { label: "מחיר קבוע", value: fixed }
              - { label: "לפי פנייה (ללא מחיר מוצג)", value: contact }
          - { label: "מחיר (₪, מספר בלבד)", name: price, widget: number, required: false, value_type: int }
          - label: "יחידת המחיר"
            name: priceUnit
            widget: select
            required: false
            options:
              - { label: "למפגש", value: session }
              - { label: "לאדם", value: person }
              - { label: "לחבילה", value: package }
          - { label: "תפוסה (טקסט חופשי, למשל: עד 5 זוגות)", name: capacity, widget: string, required: false }
          - label: "סטטוס"
            name: status
            widget: select
            default: upcoming
            hint: "טיוטה/בוטלה לא מוצגות בשום מקום פומבי. התקיימה עוברת לארכיון ב-/workshops (הדף שלה נשאר פעיל)."
            options:
              - { label: "טיוטה (לא מוצגת)", value: draft }
              - { label: "קרובה", value: upcoming }
              - { label: "אזל המקום", value: sold-out }
              - { label: "התקיימה", value: completed }
              - { label: "בוטלה", value: cancelled }
          - { label: "מומלצת (מוצגת ראשונה בדף הבית)", name: featured, widget: boolean, default: false }
          - { label: "פעילה (מוצגת באתר)", name: enabled, widget: boolean, default: true }
          - label: "שאלות נפוצות (אופציונלי)"
            name: faq
            widget: list
            required: false
            summary: "{{fields.qHe}}"
            fields:
              - { label: "שאלה", name: qHe, widget: string }
              - { label: "תשובה", name: aHe, widget: text }

  - name: podcast
    label: "פודקאסט"
    file: "src/content/podcast.yaml"
    icon: podcasts
    fields:
      - label: "כותרת הקטע"
        name: heading
        widget: object
        collapsed: true
        fields:
          - { label: "תווית קטנה", name: labelHe, widget: string }
          - { label: "כותרת", name: titleHe, widget: string }
          - { label: "כותרת משנה", name: subHe, widget: string, required: false }
          - { label: "תווית 'להאזנה'", name: ctaHe, widget: string }
      - label: "פודקאסטים"
        name: shows
        widget: list
        summary: "{{fields.nameHe}}"
        fields:
          - { label: "מזהה (slug)", name: slug, widget: string, hint: "אותיות אנגלית/מקפים — קובע את כתובת ה-URL, למשל meever-latabu." }
          - { label: "שם הפודקאסט", name: nameHe, widget: string }
          - { label: "תיאור", name: descHe, widget: text }
          - { label: "סטטוס (למשל: בקרוב — משאירים ריק כשהוא באוויר)", name: statusHe, widget: string, required: false }
          - { label: "תמונה מקדימה", name: coverImage, widget: string, required: false, hint: "כתובת תמונה קבועה. אפשר להשאיר ריק." }
          - label: "קישורים לפלטפורמות האזנה"
            name: platformLinks
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "שם הפלטפורמה (למשל YouTube, Spotify)", name: label, widget: string }
              - { label: "קישור", name: url, widget: string }
          - label: "פרקים"
            name: episodes
            widget: list
            required: false
            summary: "{{fields.titleHe}}"
            hint: "כל עוד אין פרקים כאן, כפתור ההאזנה פותח את הפלייליסט המלא. הוספת פרק כאן פותחת לו דף עצמאי משלו."
            fields:
              - { label: "מזהה (slug)", name: slug, widget: string }
              - { label: "שם הפרק", name: titleHe, widget: string }
              - { label: "תיאור", name: descHe, widget: text, required: false }
              - { label: "תאריך פרסום (YYYY-MM-DD)", name: publishedDate, widget: string, required: false }
              - { label: "משך בדקות", name: durationMinutes, widget: number, required: false, value_type: int }
              - { label: "מזהה סרטון יוטיוב", name: youtubeVideoId, widget: string, required: false, hint: "החלק שאחרי v= בכתובת היוטיוב." }
              - { label: "תמונה מקדימה (אופציונלי)", name: coverImage, widget: string, required: false }

  - name: videos
    label: "סרטונים"
    file: "src/content/videos.yaml"
    icon: movie
    fields:
      - label: "כותרת הקטע"
        name: heading
        widget: object
        collapsed: true
        fields:
          - { label: "תווית קטנה", name: labelHe, widget: string }
          - { label: "כותרת", name: titleHe, widget: string }
          - { label: "כותרת משנה", name: subHe, widget: string, required: false }
          - { label: "תווית 'לצפייה'", name: ctaHe, widget: string }
      - label: "סרטונים"
        name: items
        widget: list
        summary: "{{fields.titleHe}}"
        hint: "הרצאה מוקלטת היא גם 'סרטון' — פשוט מתארים אותה ככזו בתיאור."
        fields:
          - { label: "מזהה (slug)", name: slug, widget: string }
          - { label: "כותרת", name: titleHe, widget: string }
          - { label: "תיאור", name: descHe, widget: text }
          - { label: "תיאור לגוגל (SEO)", name: metaDescriptionHe, widget: string, required: false }
          - { label: "תמונה מקדימה", name: thumbnail, widget: string, required: false }
          - label: "מקור הסרטון"
            name: provider
            widget: select
            default: youtube
            options: [youtube, vimeo, external]
          - { label: "מזהה סרטון (ליוטיוב/וימאו)", name: videoId, widget: string, required: false }
          - { label: "קישור לסרטון (למקור חיצוני, או כגיבוי)", name: videoUrl, widget: string, required: false }
          - { label: "תאריך פרסום (YYYY-MM-DD)", name: publishedDate, widget: string, required: false }
          - { label: "מומלץ", name: featured, widget: boolean, default: false }
          - { label: "סדר תצוגה (מספר קטן יותר = ראשון)", name: order, widget: number, default: 0, value_type: int }
          - { label: "פעיל (מוצג באתר)", name: enabled, widget: boolean, default: true }

  - name: blog
    label: "בלוג ומאמרים"
    file: "src/content/blog.yaml"
    icon: article
    fields:
      - label: "כותרת הקטע"
        name: heading
        widget: object
        collapsed: true
        fields:
          - { label: "תווית קטנה", name: labelHe, widget: string }
          - { label: "כותרת", name: titleHe, widget: string }
          - { label: "כותרת משנה", name: subHe, widget: string, required: false }
          - { label: "תווית 'לקריאה'", name: ctaHe, widget: string }
      - label: "מאמרים"
        name: items
        widget: list
        summary: "{{fields.titleHe}}"
        fields:
          - { label: "מזהה (slug)", name: slug, widget: string, hint: "קובע את כתובת ה-URL של המאמר." }
          - { label: "כותרת המאמר", name: titleHe, widget: string }
          - { label: "תאריך פרסום", name: dateISO, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
          - { label: "תמונה", name: image, widget: image, required: false }
          - { label: "תקציר קצר (מוצג בכרטיס)", name: excerptHe, widget: text }
          - { label: "תוכן המאמר (הפוסט המלא)", name: bodyHe, widget: text, required: false, hint: "כתבי כאן את המאמר המלא — הוא נפתח לדף קריאה משלו. שורה ריקה = פסקה חדשה." }
          - { label: "קישור חיצוני (במקום תוכן)", name: url, widget: string, required: false, hint: "אם משאירים את התוכן ריק — הכרטיס יוביל לקישור הזה." }

  - name: store
    label: "חנות"
    file: "src/content/store.yaml"
    icon: storefront
    fields:
      - label: "כותרת הקטע"
        name: heading
        widget: object
        collapsed: true
        fields:
          - { label: "תווית קטנה", name: labelHe, widget: string }
          - { label: "כותרת", name: titleHe, widget: string }
          - { label: "כותרת משנה", name: subHe, widget: string, required: false }
          - { label: "תווית כפתור", name: ctaHe, widget: string }
      - label: "טופס הזמנה (כשאין קישור לרכישה — ראו הסבר בשדה 'קישור לרכישה' למטה)"
        name: order
        widget: object
        collapsed: true
        fields:
          - { label: "כותרת החלון", name: titleHe, widget: string }
          - { label: "תווית שדה ההערה", name: noteHe, widget: string }
          - { label: "placeholder שדה ההערה", name: notePlaceholderHe, widget: string }
          - { label: "תווית כפתור השליחה", name: submitHe, widget: string }
      - label: "מוצרים"
        name: items
        widget: list
        summary: "{{fields.titleHe}} — {{fields.price}} ₪"
        fields:
          - { label: "שם המוצר", name: titleHe, widget: string }
          - { label: "מזהה (slug) — אופציונלי, מאפשר דף מוצר עצמאי", name: slug, widget: string, required: false }
          - { label: "קטגוריה (אופציונלי, למשל: שוברים)", name: category, widget: string, required: false }
          - { label: "תמונה", name: image, widget: image }
          - { label: "תיאור", name: descHe, widget: text }
          - { label: "מחיר (₪, מספר בלבד)", name: price, widget: number, value_type: int }
          - { label: "מחיר מבצע (אופציונלי, קטן ממחיר רגיל)", name: salePrice, widget: number, required: false, value_type: int }
          - { label: "פעיל (מוצג באתר)", name: active, widget: boolean, default: true }
          - { label: "מומלץ", name: featured, widget: boolean, default: false }
          - { label: "סדר תצוגה (מספר קטן יותר = ראשון)", name: order, widget: number, default: 0, value_type: int }
          - { label: "קישור לרכישה", name: buyUrl, widget: string, required: false, hint: "עם קישור (לדף תשלום אמיתי) — הכפתור עובר אליו ישירות. ריק — הכפתור פותח טופס קצר (שם + הערה) ואז שולח הכל בוואטסאפ." }

  - name: legal
    label: "עמודים משפטיים"
    file: "src/content/legal.yaml"
    icon: gavel
    fields:
      - label: "הצהרת נגישות"
        name: accessibility
        widget: object
        collapsed: true
        fields:
          - { label: "כותרת", name: title, widget: string }
          - { label: "עודכן לאחרונה", name: updated, widget: string }
          - { label: "תוכן", name: body, widget: text }
      - label: "מדיניות פרטיות"
        name: privacy
        widget: object
        collapsed: true
        fields:
          - { label: "כותרת", name: title, widget: string }
          - { label: "עודכן לאחרונה", name: updated, widget: string }
          - { label: "תוכן", name: body, widget: text }
      - label: "תנאי שימוש"
        name: terms
        widget: object
        collapsed: true
        fields:
          - { label: "כותרת", name: title, widget: string }
          - { label: "עודכן לאחרונה", name: updated, widget: string }
          - { label: "תוכן", name: body, widget: text }

  - name: contact_info
    label: "פרטי קשר ורשתות"
    file: "src/content/site.yaml"
    icon: alternate_email
    fields:
      - { label: "אימייל", name: email, widget: string, hint: "מופיע ככפתור אימייל." }
      - { label: "אינסטגרם (כתובת)", name: instagram, widget: string }
      - { label: "קישור וואטסאפ", name: whatsapp, widget: string, hint: "למשל https://wa.me/972XXXXXXXXX — גם כפתור הברירת־מחדל של כל הכפתורים." }
      - label: "רשתות חברתיות (מוצגות עם אייקון, גם בפוטר וגם בפרטי קשר)"
        name: socials
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: "השם קובע איזה אייקון יוצג. שמות נתמכים: Instagram, WhatsApp, Facebook, YouTube, TikTok, Spotify, X, Threads, Apple Podcasts. כתובת ריקה = מוסתר."
        fields:
          - { label: "שם הרשת", name: label, widget: string }
          - { label: "כתובת (URL)", name: url, widget: string, required: false }

collections:
  # All site copy (Hebrew). Kept as a regular collection so the singletons above
  # render as 1-click sidebar items.
  - name: site_he
    label: "תוכן האתר"
    icon: article
    delete: false
    files:
      - name: site_he
        label: "כל הטקסטים באתר"
        file: "src/content/he.yaml"
        fields:
          - label: "תיאור לגוגל (SEO)"
            name: meta
            widget: object
            collapsed: true
            fields:
              - { label: "כותרת הדפדפן", name: title, widget: string }
              - { label: "תיאור בתוצאות החיפוש בגוגל", name: description, widget: string, hint: "זה הטקסט שמופיע מתחת לכותרת בגוגל." }
